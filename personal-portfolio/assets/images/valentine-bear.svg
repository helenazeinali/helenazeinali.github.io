 <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8eae"/><stop offset="1" stop-color="#e94f83"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
